# Hetzner installimage config for dev-box (EX44-1-LTD, 2 x NVMe).
# Used from the Robot rescue system: installimage -a -c /root/installimage.conf
# Only DRIVE1 is partitioned; DRIVE2 becomes /data later via data-disk.sh.
DRIVE1 /dev/nvme0n1
SWRAID 0
BOOTLOADER grub
HOSTNAME dev-box
PART /boot ext4 1G
PART / ext4 all
IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst

# Shared Claude/Codex inbox. Opening a pane acknowledges its current alert.
set-hook -gu pane-focus-in
set-hook -g after-select-window[90] 'run-shell -b "~/.local/bin/agent-attention read #{pane_id}"'
set-hook -g after-select-pane[90] 'run-shell -b "~/.local/bin/agent-attention read #{pane_id}"'
set -g status-left '[#S] #(~/.local/bin/agent-attention status) '
set -g status-left-length 80
set -g status-right '#{?#{>:#{client_width},75},F12 agents | Alt+a next,}'
set -g status-right-length 26
set -g status-interval 2
setw -g window-status-format '#[fg=#{?@agent_color,#{@agent_color},default}]#{@agent_mark}#I:#{?@agent_label,#{@agent_label},#W}#[default]'
setw -g window-status-current-format '#[fg=#{?@agent_color,#{@agent_color},default},bold]#{@agent_mark}[#I:#{?@agent_label,#{@agent_label},#W}]#[default]'
# Keep the light background; bold and brackets identify the current window.
set -g status-format[1] '#[align=left]#{W:#[range=window|#{window_index}] #{E:window-status-format} #[norange],#[range=window|#{window_index}] #{E:window-status-current-format} #[norange]}'
# Full-screen popup keeps the existing terminal contents and works on narrow phones.
set -g popup-style 'fg=default,bg=default'
set -g popup-border-style 'fg=default,bg=default'
bind -n F12 display-popup -E -w 100% -h 100% '~/.local/bin/agent-attention panel "#{client_name}"'
bind -n M-w display-popup -E -w 100% -h 100% '~/.local/bin/agent-attention panel "#{client_name}"'
bind w display-popup -E -w 100% -h 100% '~/.local/bin/agent-attention panel "#{client_name}"'
bind -n MouseDown1StatusLeft display-popup -E -w 100% -h 100% '~/.local/bin/agent-attention panel "#{client_name}"'
bind -n M-a run-shell -b '~/.local/bin/agent-attention next "#{client_name}"'
bind -n M-d run-shell -b '~/.local/bin/agent-attention read "#{pane_id}"'
# Keep the native tree available, including terminal previews.
bind W choose-tree -Zw
set -g @picker_format '#{?pane_format,#{pane_current_command},#{?window_format,#{@agent_mark}#{window_index}: #{window_name},#{session_name}}}'

# Mouse support (click panes, resize, scroll)
set -g mouse on

# Start window/pane numbering at 1 (0 is far from the other keys)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# More scrollback history
set -g history-limit 10000

# Faster escape (default 500ms feels laggy)
set -sg escape-time 10

# Split panes with | and - (easier to remember than % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in the same directory
bind c new-window -c "#{pane_current_path}"

# Reload config with r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Status bar - clean and minimal
# fg=default follows the terminal theme (readable in both Termius light and dark)
set -g status-style 'bg=default fg=default'
set -g status-left '[#S] '
set -g status-right ''

# Agent attention and window formats are configured in the shared include below.
set -g focus-events on

# Highlight the active window (overriding the formats above dropped the default highlight)
set -g window-status-current-style 'bold'

# Accept OSC 52 clipboard writes from apps inside panes (Claude Code drag-copy)
# and forward them to the outer terminal. "external" silently discards app copies.
set -g set-clipboard on

########################################
# Mobile-friendly window switching
########################################

# Two-line status bar:
#   line 0: session name (left)
#   line 1: full-width window list with padded, finger-sized tap targets
# #[range=window|N]...#[norange] marks each entry so the default
# tap-to-select-window mouse binding works on the custom list.
set -g status 2
set -g status-format[0] '#[align=left]#[range=left]#{E:status-left}#[norange]#[align=right]#{E:status-right}'
set -g status-format[1] '#[align=left]#{W:#[range=window|#{window_index}] #{E:window-status-format} #[norange],#[range=window|#{window_index}]#[bold reverse] #{E:window-status-current-format} #[norange]}'

# F12, Alt+w, and tapping [session] open the agent panel (include below).

# Single-tap switching: F1-F10 jump to windows 1-10, F11 toggles last two
# (caveat: steals F-keys from TUIs like htop/mc inside tmux)
bind -n F1  select-window -t :=1
bind -n F2  select-window -t :=2
bind -n F3  select-window -t :=3
bind -n F4  select-window -t :=4
bind -n F5  select-window -t :=5
bind -n F6  select-window -t :=6
bind -n F7  select-window -t :=7
bind -n F8  select-window -t :=8
bind -n F9  select-window -t :=9
bind -n F10 select-window -t :=10
bind -n F11 last-window

# Swipe up/down anywhere on the status bar cycles windows
bind -n WheelUpStatus previous-window
bind -n WheelDownStatus next-window
bind -n WheelUpStatusLeft previous-window
bind -n WheelDownStatusLeft next-window
bind -n WheelUpStatusDefault previous-window
bind -n WheelDownStatusDefault next-window

# No-prefix window jumps: Alt+1..9,0 (Termius key bar: tap Alt, tap digit)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Size windows to the most recently active client, not the smallest one
# (stops a phone attach from shrinking every window on the desktop)
set -g window-size latest

# Unified agent attention panel (Claude + Codex).
source-file ~/.local/share/agent-attention/tmux.conf
